version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord
      POSTGRES_PASSWORD: discord_secret
      POSTGRES_DB: discord_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord -d discord_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://discord:discord_secret@postgres:5432/discord_manager
    ports:
      - "4000:4000"
      - "4001:4001"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://discord:discord_secret@postgres:5432/discord_manager
      BOT_API_URL: http://bot:4000
      NEXT_PUBLIC_BOT_WS_URL: http://bot:4001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
